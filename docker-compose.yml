services:
  scratch:
    image: ghcr.io/jcsimon1/scratch-server:latest
    container_name: scratch
    ports:
      - "8601:80"
    restart: unless-stopped
    healthcheck:
          test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8601/ >/dev/null && test -f /downloads/.share_mounted || exit 1"]
          interval: 60s
          timeout: 5s
          start_period: 30s
          retries: 3