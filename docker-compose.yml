services:
  scratch:
    image: ghcr.io/jcsimon1/scratch-server:latest
    container_name: scratch
    ports:
      - "8601:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3